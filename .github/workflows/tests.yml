name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npx playwright install --with-deps chrome ffmpeg
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14
