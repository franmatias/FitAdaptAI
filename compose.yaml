services:
  app:
    image: fitadaptai:local
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - path: .env.docker
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
